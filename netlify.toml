# Netlify — Studio Nallan Web Design
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host is https://www.studionallan.com.
# In the Netlify UI: add BOTH studionallan.com and www.studionallan.com,
# then set www as the Primary domain — Netlify 301s the apex automatically.


